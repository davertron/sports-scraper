name: Deploy Site to S3

on:
  schedule:
    # Runs every day at 12:00 PM UTC, which is 8:00 AM EST
    - cron: "0 12 * * *"
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # Eleventy and the Tailwind CLI are devDependencies (not vendored --
      # unlike the scrape/calendar deps, Tailwind ships platform-specific
      # native binaries that can't be safely committed to git), so building
      # the site needs an install.
      - name: Install build dependencies
        run: npm install

      # Build the site (Eleventy + Tailwind CSS)
      - name: Build site
        run: npm run build

      # Install and build the frontend
      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Deploy to S3
      - name: Deploy to S3
        run: |
          aws s3 sync ./_site s3://${{ secrets.STATIC_SITE_BUCKET }} --delete
        env:
          AWS_BUCKET_NAME: ${{ secrets.STATIC_SITE_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.SITE_CLOUDFRONT_DISTRIBUTION_ID }}

      # Invalidate CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.SITE_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
