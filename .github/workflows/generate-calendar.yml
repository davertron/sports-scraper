name: Generate Hockey Calendar

on:
  workflow_run:
    workflows: ["Scrape Hockey Data"]
    types:
      - completed
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-calendar:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # node_modules is vendored (see package.json "dependencies"), so no
      # npm install is needed to generate the calendar.
      - name: Generate calendar
        run: npm run calendar
        env:
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.DATA_CLOUDFRONT_DISTRIBUTION_ID }}
